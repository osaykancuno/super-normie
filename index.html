<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Super Normie</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#0d0e0f; color:#e3e5e4;
      font-family:'Press Start 2P','Courier New',monospace;
      overflow:hidden; display:flex; justify-content:center; align-items:center; min-height:100vh;
    }
    #menu {
      text-align:center; display:flex; flex-direction:column; align-items:center; gap:12px;
      padding:18px 20px 14px; overflow-y:auto; max-height:100vh; max-height:100dvh;
      scrollbar-width:none; -ms-overflow-style:none;
    }
    #menu::-webkit-scrollbar { display:none; }
    #menu h1 { font-size:42px; letter-spacing:3px; line-height:1.2; text-shadow:3px 3px 0 #1a1b1c; margin:0; }
    #menu .sub { font-size:10px; color:rgba(227,229,228,0.45); margin:0; }
    #normie-preview {
      width:90px; height:90px; border:2px solid rgba(227,229,228,0.15);
      image-rendering:pixelated; background:#1a1b1c; display:block;
    }
    #menu input {
      background:#1a1b1c; border:1px solid rgba(227,229,228,0.15); color:#e3e5e4;
      padding:8px 16px; font-family:inherit; font-size:13px; text-align:center; width:200px;
    }
    #menu input:focus { outline:none; border-color:rgba(227,229,228,0.4); }
    #menu button {
      background:transparent; border:1px solid rgba(227,229,228,0.3); color:#e3e5e4;
      padding:10px 36px; font-family:inherit; font-size:13px; cursor:pointer; transition:all .2s;
    }
    #menu button:hover { background:rgba(227,229,228,0.1); border-color:rgba(227,229,228,0.5); }
    .info { font-size:9px; color:rgba(227,229,228,0.35); line-height:1.8; margin:0; }
    .err { color:#a44; font-size:9px; min-height:14px; margin:-4px 0 -4px; }
    canvas { display:none; image-rendering:pixelated; image-rendering:crisp-edges; }
    #touch { display:none; position:fixed; bottom:0; left:0; right:0; pointer-events:none; }
    .tb {
      position:fixed; width:70px; height:70px; background:rgba(227,229,228,0.15);
      border:1px solid rgba(227,229,228,0.2); color:rgba(227,229,228,0.5);
      display:flex; align-items:center; justify-content:center; font-size:28px;
      border-radius:10px; user-select:none; -webkit-user-select:none;
      touch-action:none; pointer-events:auto;
    }
    #bl { bottom:18px; left:18px; }
    #br { bottom:18px; left:100px; }
    #bj { bottom:18px; right:18px; }
    @media(max-width:600px){
      #menu h1{font-size:26px;} #menu{gap:10px;padding:10px 14px 14px;}
      #menu button{padding:8px 18px;font-size:11px;}
      .info{font-size:8px;line-height:1.6;} #normie-preview{width:70px;height:70px;}
    }
    /* Landscape on mobile — compact everything for short viewport */
    @media(orientation:landscape) and (max-height:500px){
      body{align-items:flex-start;}
      #menu{gap:6px;padding:6px 14px 10px;}
      #menu h1{font-size:20px;letter-spacing:2px;}
      #menu .sub{font-size:8px;}
      #normie-preview{width:50px;height:50px;}
      #menu input{padding:5px 12px;font-size:11px;width:170px;}
      #menu button{padding:5px 16px;font-size:9px;}
      .info{font-size:7px;line-height:1.4;}
      .err{font-size:8px;min-height:10px;margin:-2px 0 -2px;}
      .tb{width:50px;height:50px;font-size:20px;border-radius:8px;}
      #bl{bottom:8px;left:8px;}
      #br{bottom:8px;left:66px;}
      #bj{bottom:8px;right:8px;}
    }
    /* iPhone safe areas (notch/Dynamic Island) */
    @supports(padding:env(safe-area-inset-left)){
      #bl{left:calc(18px + env(safe-area-inset-left));}
      #br{left:calc(100px + env(safe-area-inset-left));}
      #bj{right:calc(18px + env(safe-area-inset-right));}
      #menu{padding-left:calc(20px + env(safe-area-inset-left));padding-right:calc(20px + env(safe-area-inset-right));}
    }
    @media(orientation:landscape) and (max-height:500px){
      @supports(padding:env(safe-area-inset-left)){
        #bl{left:calc(8px + env(safe-area-inset-left));}
        #br{left:calc(66px + env(safe-area-inset-left));}
        #bj{right:calc(8px + env(safe-area-inset-right));}
      }
    }
  </style>

<body>
  <div id="menu">
    <h1>SUPER<br>NORMIE</h1>
    <p class="sub">A Normies Community Game by <a href="https://x.com/OsayKancuno" target="_blank" rel="noopener" style="color:rgba(227,229,228,0.65);text-decoration:none;transition:color .2s;" onmouseover="this.style.color='#e3e5e4'" onmouseout="this.style.color='rgba(227,229,228,0.65)'">@OsayKancuno</a></p>

let actx,sndMode=2,musGain,sfxGain,musIv,musPlaying=false;
try{const sm=localStorage.getItem('sn_snd');if(sm!==null)sndMode=parseInt(sm)}catch(e){}
function iA(){if(!actx){actx=new(window.AudioContext||window.webkitAudioContext)();
sfxGain=actx.createGain();sfxGain.connect(actx.destination);
musGain=actx.createGain();musGain.connect(actx.destination);
musGain.gain.value=sndMode===2?.08:0;sfxGain.gain.value=sndMode>0?.1:0}}
function toggleSnd(){sndMode=(sndMode+1)%3;try{localStorage.setItem('sn_snd',sndMode)}catch(e){}
if(actx){musGain.gain.value=sndMode===2?.08:0;sfxGain.gain.value=sndMode>0?.1:0}
if(sndMode===2&&!musPlaying)startMusic();if(sndMode<2)stopMusic()}
function bp(f,d,t,v){if(!actx||sndMode===0)return;const o=actx.createOscillator(),g=actx.createGain();
o.type=t||'square';o.frequency.value=f;g.gain.value=v||.1;
g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(sfxGain);o.start();o.stop(actx.currentTime+d)}
function sfx(n){iA();if(sndMode===0)return;switch(n){
case'j':bp(400,.15);setTimeout(()=>bp(600,.1),50);break;
case'c':bp(988,.08);setTimeout(()=>bp(1319,.15),80);break;
case's':bp(200,.1,'sawtooth',.15);break;
case'b':bp(150,.08,'triangle');break;
case'd':bp(400,.1);setTimeout(()=>bp(300,.1),100);setTimeout(()=>bp(200,.2),200);break;
case'w':[0,100,200,300,400].forEach((d,i)=>setTimeout(()=>bp(523+i*100,.15),d));break;
case'k':bp(500,.06);setTimeout(()=>bp(800,.1),60);break;
case'bh':bp(120,.2,'sawtooth',.2);setTimeout(()=>bp(80,.3,'sawtooth',.15),100);break;
case'bd':[0,80,160,240,320].forEach((d,i)=>setTimeout(()=>bp(800-i*120,.2,'square',.12),d));break;
}}

function startMusic(){if(!actx||musPlaying)return;musPlaying=true;musBar=0;musBeat=0;musTimer=0;
musIv=setInterval(()=>{if(sndMode<2){stopMusic();return}
const mel=musNotes[musBar%4][musBeat%8];const bas=musBass[musBeat%8];
const o1=actx.createOscillator(),g1=actx.createGain();o1.type='square';o1.frequency.value=mel;
g1.gain.value=.06;g1.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.18);
o1.connect(g1);g1.connect(musGain);o1.start();o1.stop(actx.currentTime+.2);
const o2=actx.createOscillator(),g2=actx.createGain();o2.type='triangle';o2.frequency.value=bas;
g2.gain.value=.08;g2.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.18);
o2.connect(g2);g2.connect(musGain);o2.start();o2.stop(actx.currentTime+.2);
musBeat++;if(musBeat>=8){musBeat=0;musBar++}},214)}

// Trait loading
async function loadTraits(id){
  tMod={spd:1,jmp:1,cRad:18,cMul:1,bLives:0,abs:[]};
  try{
    const r=await fetch('https://api.normies.art/normie/'+id+'/traits');
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(!d||!Array.isArray(d.attributes)) return;
    const attr=d.attributes;
    const get=t=>((attr.find(a=>a.trait_type===t))||{}).value||'';
    const type=get('Type'),age=get('Age'),acc=get('Accessory'),eyes=get('Eyes'),expr=get('Expression');
    if(['Zombie','Ape','Alien'].includes(type)){tMod.bLives++;tMod.abs.push(type+': +1 Life')}
    if(age==='Young'){tMod.spd=1.15;tMod.abs.push('Young: +15% Speed')}
    if(age==='Old'){tMod.bLives++;tMod.abs.push('Old: +1 Life')}
    if(['Top Hat','Cowboy Hat','Cap','Pilot Helmet'].includes(acc)){tMod.jmp=1.15;tMod.abs.push(acc+': +15% Jump')}
    if(['Bandana','Headband','Do-rag'].includes(acc)){tMod.spd=Math.max(tMod.spd,1.15);tMod.abs.push(acc+': +15% Speed')}
    if(eyes&&eyes!=='No Glasses'){tMod.cRad=27;tMod.abs.push(eyes+': +50% Coin Range')}
    if(['Smile','Slight Smile','Laughing'].includes(expr)){tMod.cMul=2;tMod.abs.push(expr+': 2x Coin Score')}
  }catch(e){}
}

function fmtTime(frames){
  const s=frames/60;const m=Math.floor(s/60);const sec=s%60;
  return String(m).padStart(2,'0')+':'+sec.toFixed(2).padStart(5,'0');
}

function loadBest(id){
  try{const d=JSON.parse(localStorage.getItem('sn_best_'+id));if(d){bestScore=d.s||0;bestTime=d.t||Infinity}else{bestScore=0;bestTime=Infinity}}catch(e){bestScore=0;bestTime=Infinity}
}
function saveBest(id){
  try{localStorage.setItem('sn_best_'+id,JSON.stringify({s:Math.max(score,bestScore),t:Math.min(runTime,bestTime)}))}catch(e){}
}

function shareOnX(){
  const t=fmtTime(runTime);
  const ab=tMod.abs.length?(' ['+tMod.abs.map(a=>a.split(':')[1].trim()).join(', ')+']'):'';
  const txt=encodeURIComponent('I scored '+score+' pts in '+t+' with Normie #'+nId+' in Super Normie!'+ab+'\n\nCan you beat me?\nnormies.art/tools');
  window.open('https://twitter.com/intent/tweet?text='+txt,'_blank');
}

// Dynamic canvas scaling — keeps 2:1 ratio, fits any viewport (portrait + landscape)
function resizeCanvas(){
  if(!cv||cv.style.display==='none')return;
  const vw=window.innerWidth,vh=window.innerHeight,ratio=CW/CH;
  let w=vw,h=vw/ratio;
  if(h>vh){h=vh;w=vh*ratio}
  cv.style.width=w+'px';cv.style.height=h+'px';
}
window.addEventListener('resize',resizeCanvas);

// Helper: initialize canvas and hide menu
function initCanvas(){
  cv=document.getElementById('gc');cx=cv.getContext('2d');
  cv.width=CW;cv.height=CH;cv.style.display='block';
  resizeCanvas();
  document.getElementById('menu').style.display='none';
  initCanvasClick();
}

// Helper: load normie image by ID (returns Promise)
function loadNormieImg(id){
  return new Promise((resolve,reject)=>{
    nImg=new Image();nImg.crossOrigin='anonymous';
    nImg.onload=()=>{nLoaded=true;resolve()};
    nImg.onerror=()=>{
      if(!nImg._retried){nImg._retried=true;nImg.src='https://api.normies.art/normie/'+id+'/image.png?t='+Date.now()}
      else{nLoaded=false;reject(new Error('Image load failed'))}
    };
    nImg.src='https://api.normies.art/normie/'+id+'/image.png';
  });
}

function buildLv(n){
  const d=LVS[n],W=d.w,H=RW;
  const m=Array.from({length:H},()=>new Array(W).fill(T.A));
  const gnd=mkG(W,d.gaps);
  for(let x=0;x<W;x++){if(gnd[x]){m[H-1][x]=T.G;m[H-2][x]=T.G}else{m[H-1][x]=T.FIRE;m[H-2][x]=T.FIRE}}
  d.plat.forEach(([px,py,pw,pt])=>{const tt=pt==='Q'?T.Q:T.B;for(let i=0;i<pw;i++)if(px+i<W)m[py][px+i]=tt});
  d.pipes.forEach(([px,ph])=>{for(let dy=0;dy<ph;dy++){const y=H-3-dy;if(y>=0){m[y][px]=dy===ph-1?T.PTL:T.PBL;m[y][px+1]=dy===ph-1?T.PTR:T.PBR}}});
  for(let y=3;y<=H-3;y++)m[y][d.fx]=T.F;
  m[2][d.fx]=T.FT;
  tiles=m;lW=W;
  ens=d.enm.map(([ex,ey])=>({x:ex*TZ,y:ey*TZ,w:28,h:28,vx:-1.2,vy:0,alive:true,fr:0,grounded:false}));
  cns=d.coins.map(([cx,cy])=>({x:cx*TZ+8,y:cy*TZ+8,col:false,fr:Math.random()*6}));
  pl={x:3*TZ,y:10*TZ,w:28,h:30,vx:0,vy:0,grounded:false,face:1,dead:false,inv:0};
  cam={x:0};pts=[];dT=0;cT=0;
}

  stars=[];for(let i=0;i<80;i++)stars.push({x:Math.random()*CW,y:Math.random()*CH*.6,s:Math.random()*2+.5,b:Math.random()});
}

    }
    if(mpState==='waiting'&&e.code==='Escape'){if(mpWs){mpWs.send(JSON.stringify({type:'leave'}));mpWs.close();mpWs=null}mpState='menu';return}

  }
  if(gs==='mpresult'&&(e.code==='Space'||e.code==='Enter')){if(mpWs){mpWs.close();mpWs=null}mpState='none';mpGhost.vis=false;toMenu();return}
  if(gs==='abs'&&abT<=0){gs='play';return}

  if((gs==='go'||gs==='win')&&(e.code==='Space'||e.code==='Enter'))toMenu();
});
document.addEventListener('keyup',e=>{keys[e.code]=false});
function kd(a){switch(a){case'l':return keys.ArrowLeft||keys.KeyA;case'r':return keys.ArrowRight||keys.KeyD;case'j':return keys.Space||keys.ArrowUp||keys.KeyW}}

// Canvas click for share button + sound toggle + mobile tap support
let canvasClickInit=false;
function initCanvasClick(){
  if(canvasClickInit)return;canvasClickInit=true;
  cv.addEventListener('click',e=>{
    const rect=cv.getBoundingClientRect();
    const scaleX=CW/rect.width,scaleY=CH/rect.height;
    const mx=(e.clientX-rect.left)*scaleX,my=(e.clientY-rect.top)*scaleY;
    // Sound icon (top-right, 28x28)

    if(shareBtn.vis&&mx>=shareBtn.x&&mx<=shareBtn.x+shareBtn.w&&my>=shareBtn.y&&my<=shareBtn.y+shareBtn.h){shareOnX();return}
    // Tap-to-continue on overlay screens
    if(gs==='dead'&&dT<=0){respawn();return}
    if(gs==='lc'&&cT<=0){if(dailyMode){dailyFinish()}else{nextLv()};return}
    if(gs==='go'||gs==='win'){toMenu();return}
    if(gs==='achscr'){toMenu();return}
    if(gs==='dailylb'){gs='play';return}
    if(gs==='abs'&&abT<=0){gs='play';return}
    if(gs==='mpresult'){if(mpWs){mpWs.close();mpWs=null}mpState='none';mpGhost.vis=false;toMenu();return}
    // Multiplayer menu touch support
    if(gs==='mp'){
      const bw=280,bx=CW/2-bw/2;
      if(mpState==='menu'){
        // CREATE ROOM button (y=140-172)
        if(mx>=bx&&mx<=bx+bw&&my>=140&&my<=172){mpCreateRoom();return}
        // JOIN ROOM button (y=182-214, only if code is 4 digits)
        if(mx>=bx&&mx<=bx+bw&&my>=182&&my<=214){if(mpInputCode.length===4)mpJoinRoom(mpInputCode);return}
        // Numpad buttons (3x4 grid, padY=280, bH=28, gap=3)
        const padX=CW/2-85,padY=280,bW=50,bH=28,gap=3;
        const numLayout=['1','2','3','4','5','6','7','8','9','DEL','0','GO'];
        for(let i=0;i<12;i++){
          const col=i%3,row=Math.floor(i/3);
          const nx=padX+col*(bW+gap),ny=padY+row*(bH+gap);
          if(mx>=nx&&mx<=nx+bW&&my>=ny&&my<=ny+bH){
            const key=numLayout[i];
            if(key==='DEL'){mpInputCode=mpInputCode.slice(0,-1)}
            else if(key==='GO'){if(mpInputCode.length===4)mpJoinRoom(mpInputCode)}
            else if(mpInputCode.length<4){mpInputCode+=key}
            return;
          }
        }
        // BACK button (y=410-440)
        if(mx>=CW/2-60&&mx<=CW/2+60&&my>=410&&my<=440){toMenu();return}
      }
      if(mpState==='waiting'){
        // BACK/CANCEL button
        if(mx>=CW/2-60&&mx<=CW/2+60&&my>=CH-50&&my<=CH-15){
          if(mpWs){mpWs.send(JSON.stringify({type:'leave'}));mpWs.close();mpWs=null}
          mpState='menu';return;
        }
      }
      return;
    }
  });
}

// Collision
function gT(tx,ty){if(tx<0||tx>=lW||ty<0||ty>=RW)return ty>=RW?T.G:T.A;return tiles[ty][tx]}
function isSolid(t){return t===T.G||t===T.B||t===T.Q||t===T.U||(t>=T.PTL&&t<=T.PBR)}

function moveEnt(e){
  e.x+=e.vx;
  let l=Math.floor(e.x/TZ),r=Math.floor((e.x+e.w-1)/TZ),t=Math.floor(e.y/TZ),b=Math.floor((e.y+e.h-1)/TZ);
  for(let ty=t;ty<=b;ty++)for(let tx=l;tx<=r;tx++){
    if(isSolid(gT(tx,ty))){if(e.vx>0)e.x=tx*TZ-e.w;else if(e.vx<0)e.x=(tx+1)*TZ;
    if(e===pl)e.vx=0;else e.vx=-e.vx}}
  e.y+=e.vy;
  l=Math.floor(e.x/TZ);r=Math.floor((e.x+e.w-1)/TZ);t=Math.floor(e.y/TZ);b=Math.floor((e.y+e.h-1)/TZ);
  e.grounded=false;
  for(let ty=t;ty<=b;ty++)for(let tx=l;tx<=r;tx++){
    if(isSolid(gT(tx,ty))){if(e.vy>0){e.y=ty*TZ-e.h;e.grounded=true}else if(e.vy<0){e.y=(ty+1)*TZ;if(e===pl)hitBlk(tx,ty)}e.vy=0}}
}

function hitBlk(tx,ty){
  const t=gT(tx,ty);
  if(t===T.Q){tiles[ty][tx]=T.U;score+=100;cc++;sfx('k');spCP(tx*TZ+TZ/2,ty*TZ)}
  else if(t===T.B){sfx('b');spP(tx*TZ+TZ/2,ty*TZ+TZ/2,4,COL.brk)}
}

function spP(x,y,n,c){for(let i=0;i<n;i++)pts.push({x,y,vx:(Math.random()-.5)*4,vy:-Math.random()*5-2,life:30+Math.random()*20,c,sz:2+Math.random()*3})}
function spCP(x,y){pts.push({x,y,vx:0,vy:-6,life:25,c:COL.coin,sz:8,ic:true})}

// Boss Fight
function buildBossArena(){
  const W=40,H=RW;
  const m=Array.from({length:H},()=>new Array(W).fill(T.A));
  for(let x=0;x<W;x++){m[H-1][x]=T.G;m[H-2][x]=T.G}
  // Add a few platforms for player to use
  for(let i=0;i<4;i++)m[9][8+i]=T.B;
  for(let i=0;i<4;i++)m[9][28+i]=T.B;
  for(let i=0;i<6;i++)m[6][17+i]=T.B;
  tiles=m;lW=W;
  ens=[];cns=[];
  pl={x:3*TZ,y:10*TZ,w:28,h:30,vx:0,vy:0,grounded:false,face:1,dead:false,inv:0};
  cam={x:0};pts=[];
  boss={x:W*TZ-140,y:10*TZ,w:90,h:90,vx:-2,vy:0,hp:3,maxHp:3,
    phase:1,timer:0,hit:0,grounded:false,face:-1,charge:false,
    gp:false,gpLand:false,shockT:0};
}
function updateBoss(){
  if(!boss||boss.hp<=0)return;
  const b=boss;b.timer++;
  // Phase-based AI
  const spd=1.5+(.5*(3-b.hp)); // gets faster as HP drops
  if(b.hit>0){b.hit--;return} // stunned after hit

  if(b.phase===1){
    // Walk back and forth, jump periodically
    b.vx=b.face*spd;
    if(b.timer%120===0&&b.grounded){b.vy=-10;b.grounded=false}
    if(b.x<TZ*2){b.face=1}if(b.x>lW*TZ-b.w-TZ*2){b.face=-1}
  }
  if(b.phase===2){
    // Charge at player
    if(!b.charge){
      b.face=pl.x<b.x?-1:1;
      if(b.timer%90===0){b.charge=true;b.timer=0}
      else b.vx=b.face*spd*0.5;
    }else{
      b.vx=b.face*spd*2.5;
      if(b.timer>40){b.charge=false;b.timer=0;b.vx=0}
    }
    if(b.x<TZ){b.face=1;b.charge=false}if(b.x>lW*TZ-b.w-TZ){b.face=-1;b.charge=false}
  }
  if(b.phase===3){
    // Ground pound: jump high, slam down, shockwave
    if(!b.gp){
      b.vx=b.face*spd*0.8;
      if(b.x<TZ*3){b.face=1}if(b.x>lW*TZ-b.w-TZ*3){b.face=-1}
      if(b.timer%100===0&&b.grounded){b.vy=-14;b.gp=true;b.gpLand=false}
    }else{
      b.vx=0;
      if(b.vy>0)b.vy=14; // slam down fast
      if(b.grounded&&!b.gpLand){
        b.gpLand=true;b.shockT=20;b.gp=false;
        sfx('bh');spP(b.x+b.w/2,b.y+b.h,12,'#a44');
        // Shockwave damages player if on ground nearby
        if(pl.grounded&&Math.abs(pl.x-b.x)<TZ*5&&pl.inv<=0)pDie();
      }
    }
  }
  b.vy+=GR;if(b.vy>14)b.vy=14;
  // Move boss with collision
  b.x+=b.vx;
  if(b.x<0){b.x=0;b.vx=0;b.face=1}
  if(b.x>lW*TZ-b.w){b.x=lW*TZ-b.w;b.vx=0;b.face=-1}
  b.y+=b.vy;
  const bl=Math.floor(b.x/TZ),br2=Math.floor((b.x+b.w-1)/TZ);
  const bt=Math.floor(b.y/TZ),bb=Math.floor((b.y+b.h-1)/TZ);
  b.grounded=false;
  for(let ty=bt;ty<=bb;ty++)for(let tx=bl;tx<=br2;tx++){
    if(isSolid(gT(tx,ty))&&b.vy>=0){b.y=ty*TZ-b.h;b.grounded=true;b.vy=0}}

  // Player stomp detection
  if(!pl.dead&&pl.inv<=0&&rOv(pl,{x:b.x,y:b.y,w:b.w,h:b.h})){
    if(pl.vy>0&&pl.y+pl.h-10<b.y+b.h/2){
      // Stomp!
      b.hp--;b.hit=45;b.vy=-6;pl.vy=JF*.7;pl.inv=60;
      sfx('bh');spP(b.x+b.w/2,b.y,8,'#d44');score+=500;
      if(b.hp<=0){
        // Boss defeated!
        sfx('bd');score+=2000;
        unlock('boss_kill');
        if(totalDeaths===0)unlock('perfect');
        gs='win';newRecord=false;
        if(score>bestScore||runTime<bestTime){newRecord=true;saveBest(nId);loadBest(nId)}
        return;
      }else{
        b.phase=4-b.hp; // phase goes 1→2→3
      }
    }else{
      pDie();
    }
  }
  if(b.shockT>0)b.shockT--;
}
function renderBoss(){
  if(!boss)return;const b=boss;
  const flash=b.hit>0&&Math.floor(b.hit/3)%2;
  if(!flash){
    if(bossLoaded){
      cx.save();
      if(b.face>0){cx.translate(b.x+b.w,b.y);cx.scale(-1,1);cx.drawImage(bossImg,0,0,b.w,b.h)}
      else cx.drawImage(bossImg,b.x,b.y,b.w,b.h);
      cx.restore();
    }else{
      cx.fillStyle=b.hit>0?'#a44':'#6a2a2a';cx.fillRect(b.x,b.y,b.w,b.h);
      cx.fillStyle='#fff';cx.font='10px "Press Start 2P",monospace';cx.fillText('BOSS',b.x+18,b.y+50);
    }
  }
  // Shockwave effect
  if(b.shockT>0){
    cx.strokeStyle=`rgba(170,68,68,${b.shockT/20})`;cx.lineWidth=3;
    cx.beginPath();cx.arc(b.x+b.w/2,b.y+b.h,TZ*5*(1-b.shockT/20),.8*Math.PI,.2*Math.PI);cx.stroke();
  }
}
function drawBossHP(){
  if(!boss)return;const b=boss;
  const bw=200,bh=16,bx=CW/2-bw/2,by=42;
  cx.fillStyle='rgba(0,0,0,0.6)';cx.fillRect(bx-2,by-2,bw+4,bh+4);
  cx.fillStyle='#3a1a1a';cx.fillRect(bx,by,bw,bh);
  const pct=b.hp/b.maxHp;
  cx.fillStyle=pct>.5?'#a44':pct>.25?'#a84':'#d44';
  cx.fillRect(bx,by,bw*pct,bh);
  cx.strokeStyle='rgba(227,229,228,0.3)';cx.lineWidth=1;cx.strokeRect(bx,by,bw,bh);
  cx.font='8px "Press Start 2P",monospace';cx.fillStyle=COL.txt;cx.textAlign='center';
  cx.fillText('NORMIE #4354',CW/2,by-5);cx.textAlign='left';
}

function rOv(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

// Update
function update(){
  if(gs==='abs'){abT--;if(abT<=0)gs='play';return}
  if(gs!=='play'&&gs!=='boss'){
    if(gs==='dead'){dT--;pl.vy+=GR;pl.y+=pl.vy}
    if(gs==='lc')cT--;
    return;
  }
  runTime++;
  const mSpd=MS*tMod.spd;
  if(!pl.dead){
    if(kd('l')){pl.vx-=MA;pl.face=-1}else if(kd('r')){pl.vx+=MA;pl.face=1}else pl.vx*=FR;
    pl.vx=Math.max(-mSpd,Math.min(mSpd,pl.vx));if(Math.abs(pl.vx)<.1)pl.vx=0;
    if(kd('j')&&pl.grounded){pl.vy=JF*tMod.jmp;pl.grounded=false;sfx('j')}
    if(!kd('j')&&pl.vy<-3)pl.vy=-3;
  }
  pl.vy+=GR;if(pl.vy>12)pl.vy=12;
  moveEnt(pl);
  if(pl.y>RW*TZ+50){pDie();return}
  // Fire tile death check
  if(!pl.dead&&pl.inv<=0){
    const ftL=Math.floor(pl.x/TZ),ftR=Math.floor((pl.x+pl.w-1)/TZ),ftB=Math.floor((pl.y+pl.h-1)/TZ);
    for(let fx=ftL;fx<=ftR;fx++){if(gT(fx,ftB)===T.FIRE||gT(fx,ftB-1)===T.FIRE){pDie();break}}
  }
  if(pl.x<0){pl.x=0;pl.vx=0}
  if(pl.x>(lW-1)*TZ)pl.x=(lW-1)*TZ;
  if(pl.inv>0)pl.inv--;

  ens.forEach(e=>{
    if(!e.alive)return;e.vy+=GR;e.fr+=.05;moveEnt(e);
    if(e.y>RW*TZ+50){e.alive=false;return}
    const eTB=Math.floor((e.y+e.h-1)/TZ);if(eTB>=RW-2&&gT(Math.floor((e.x+e.w/2)/TZ),eTB)===T.FIRE){e.alive=false;return}
    const ah=Math.floor((e.x+e.w/2+e.vx*10)/TZ),bw=Math.floor((e.y+e.h+2)/TZ);
    if(e.grounded&&!isSolid(gT(ah,bw)))e.vx=-e.vx;
    if(!pl.dead&&pl.inv<=0&&rOv(pl,e)){
      if(pl.vy>0&&pl.y+pl.h-8<e.y+e.h/2){e.alive=false;pl.vy=JF*.6;pl.inv=10;score+=200;sfx('s');spP(e.x+e.w/2,e.y+e.h/2,6,COL.en);unlock('first_kill')}
      else pDie();
    }
  });

  const cr=tMod.cRad;
  cns.forEach(c=>{
    if(c.col)return;c.fr+=.05;
    if(Math.abs(pl.x+pl.w/2-c.x)<cr&&Math.abs(pl.y+pl.h/2-c.y)<cr){c.col=true;cc++;score+=50*tMod.cMul;sfx('c');spP(c.x,c.y,5,COL.coin);
      if(cc>=50)unlock('coin_50');if(score>=10000)unlock('score_10k')}
  });

  pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.2;p.life--});
  pts=pts.filter(p=>p.life>0);

  // Boss update
  if(gs==='boss')updateBoss();

  const tx=pl.x-CW*.35;
  cam.x+=(tx-cam.x)*.1;
  cam.x=Math.max(0,Math.min(lW*TZ-CW,cam.x));

  if(gs==='boss')return; // No flag in boss arena

  // Send multiplayer updates every 4 frames
  if(mpState==='racing'&&runTime%4===0)mpSendUpdate();

  // Flag check
  const flagX=dailyMode?dailyFx:LVS[cLv].fx;
  if(pl.x+pl.w>flagX*TZ-8&&pl.x<flagX*TZ+TZ){
    gs='lc';cT=120;sfx('w');
    // Achievement checks on level clear
    if(runTime/60<30)unlock('speed_30');
    if(cns.every(c=>c.col))unlock('all_coins');
    if(score>=10000)unlock('score_10k');
    // Multiplayer flag
    if(mpState==='racing'&&mpWs&&mpWs.readyState===1){
      mpWs.send(JSON.stringify({type:'flag',normieId:nId,time:runTime,score}));
      mpResult={won:true};gs='mpresult';stopMusic();unlock('mp_win');return;
    }
    if(dailyMode){/* handled by dailyFinish on keypress */}
    else if(cLv>=LVS.length-1){
      newRecord=false;
      if(score>bestScore||runTime<bestTime){newRecord=true;saveBest(nId);loadBest(nId)}
      if(totalDeaths===0)unlock('no_death');
    }
  }
}

let wasBoss=false,savedBossHp=0,savedBossPhase=1;
function pDie(){if(pl.dead)return;wasBoss=(gs==='boss');
  if(wasBoss&&boss){savedBossHp=boss.hp;savedBossPhase=boss.phase}
  pl.dead=true;pl.vy=JF;lives--;totalDeaths++;sfx('d');gs='dead';dT=90;if(lives<=0)gs='go'}
function respawn(){if(gs!=='dead'||dT>0)return;
  if(wasBoss){buildBossArena();boss.hp=savedBossHp;boss.phase=savedBossPhase;gs='boss'}
  else if(dailyMode){buildDailyLv(dailySeed);gs='play'}
  else{buildLv(cLv);gs='play'}}
function nextLv(){if(cT>0)return;cLv++;if(cLv>=LVS.length){
  // Boss fight instead of instant win
  buildBossArena();gs='boss';
}else{buildLv(cLv);gs='play'}}
function toMenu(){gs='menu';stopMusic();dailyMode=false;
  if(mpWs){try{mpWs.close()}catch(e){};mpWs=null}
  mpState='none';mpGhost.vis=false;mpInputCode='';
  document.getElementById('menu').style.display='flex';cv.style.display='none';
  document.getElementById('touch').style.display='none';score=0;cc=0;lives=3;cLv=0;runTime=0}

// Render
function render(){
  cx.fillStyle=COL.bg;cx.fillRect(0,0,CW,CH);

  if(gs==='abs'){drawAbilities();return}
  if(gs==='achscr'){drawAchScreen();return}
  if(gs==='dailylb'){drawDailyLB();return}
  if(gs==='mp'){drawMPScreen();return}
  if(gs==='mpresult'){drawMPResult();return}

  stars.forEach(s=>{const f=.5+.5*Math.sin(Date.now()*.003+s.b*10);cx.fillStyle=`rgba(227,229,228,${(.2+.3*f).toFixed(2)})`;cx.fillRect(s.x,s.y,s.s,s.s)});
  const ss=cam.x*.15;cx.fillStyle='#1a1b1c';
  for(let i=0;i<CW/4+2;i++){const si=Math.floor((i+ss/4)%skyL.length);const h=skyL[si]*12;cx.fillRect(i*4-ss%4,CH-h-TZ*2,4,h)}

  cx.save();cx.translate(-Math.floor(cam.x),0);
  const sc=Math.floor(cam.x/TZ),ec=Math.min(sc+VC+2,lW);

  for(let ty=0;ty<RW;ty++)for(let tx=sc;tx<ec;tx++){
    const t=gT(tx,ty);if(t===T.A)continue;const x=tx*TZ,y=ty*TZ;
    switch(t){
      case T.G:
        cx.fillStyle=COL.gnd;cx.fillRect(x,y,TZ,TZ);
        if(ty>0&&gT(tx,ty-1)===T.A){cx.fillStyle=COL.gndT;cx.fillRect(x,y,TZ,3);
          cx.fillStyle='#666';if((tx+ty)%3===0)cx.fillRect(x+6,y-1,2,3);if((tx+ty)%5===0)cx.fillRect(x+22,y-1,2,3)}
        cx.fillStyle='rgba(0,0,0,0.2)';cx.fillRect(x,y+TZ-1,TZ,1);cx.fillRect(x+TZ-1,y,1,TZ);break;
      case T.B:
        cx.fillStyle=COL.brk;cx.fillRect(x,y,TZ,TZ);cx.fillStyle=COL.brkL;
        cx.fillRect(x+TZ/2,y,1,TZ);cx.fillRect(x,y+TZ/2,TZ,1);cx.fillRect(x,y,TZ,1);cx.fillRect(x,y+TZ-1,TZ,1);break;
      case T.Q:
        cx.fillStyle=COL.q;cx.fillRect(x,y,TZ,TZ);cx.fillStyle=COL.qH;cx.fillRect(x+2,y+2,TZ-4,2);
        cx.font='16px "Press Start 2P",monospace';cx.fillStyle=COL.qH;cx.fillText('?',x+9,y+23);break;
      case T.U:
        cx.fillStyle=COL.used;cx.fillRect(x,y,TZ,TZ);cx.fillStyle=COL.brkL;cx.fillRect(x,y,TZ,1);cx.fillRect(x,y+TZ-1,TZ,1);break;
      case T.PTL:
        cx.fillStyle=COL.pipe;cx.fillRect(x-4,y,TZ+4,TZ);cx.fillStyle=COL.pipeH;cx.fillRect(x-4,y,TZ+4,4);cx.fillStyle=COL.pipeD;cx.fillRect(x-4,y,3,TZ);break;
      case T.PTR:
        cx.fillStyle=COL.pipe;cx.fillRect(x,y,TZ+4,TZ);cx.fillStyle=COL.pipeH;cx.fillRect(x,y,TZ+4,4);cx.fillStyle=COL.pipeD;cx.fillRect(x+TZ+1,y,3,TZ);break;
      case T.PBL:
        cx.fillStyle=COL.pipe;cx.fillRect(x,y,TZ,TZ);cx.fillStyle=COL.pipeD;cx.fillRect(x,y,3,TZ);break;
      case T.PBR:
        cx.fillStyle=COL.pipe;cx.fillRect(x,y,TZ,TZ);cx.fillStyle=COL.pipeD;cx.fillRect(x+TZ-3,y,3,TZ);break;
      case T.F:
        cx.fillStyle=COL.flag;cx.fillRect(x+TZ/2-2,y,4,TZ);break;
      case T.FT:
        cx.fillStyle=COL.flag;cx.fillRect(x+TZ/2-2,y,4,TZ);
        cx.fillStyle='#d44';cx.beginPath();cx.moveTo(x+TZ/2+2,y+4);cx.lineTo(x+TZ/2+18,y+12);cx.lineTo(x+TZ/2+2,y+20);cx.fill();
        cx.fillStyle=COL.flag;cx.fillRect(x+TZ/2-4,y,8,6);break;
      case T.FIRE:{
        const ft=Date.now()*.005+x*.3;
        const fh1=8+Math.sin(ft)*6,fh2=6+Math.cos(ft*1.3+2)*5,fh3=10+Math.sin(ft*.8+4)*4;
        cx.fillStyle='#d44';cx.fillRect(x+2,y+TZ-fh1,8,fh1);
        cx.fillStyle='#e86';cx.fillRect(x+12,y+TZ-fh2,6,fh2);
        cx.fillStyle='#fa4';cx.fillRect(x+20,y+TZ-fh3,10,fh3);
        cx.fillStyle='#d44';cx.fillRect(x+7,y+TZ-fh2*.7,5,fh2*.7);
        break;}
    }
  }

  // Coins
  cns.forEach(c=>{if(c.col)return;const st=Math.abs(Math.cos(c.fr*2)),w=12*st;
    cx.fillStyle=COL.coin;cx.fillRect(c.x-w/2,c.y-6,w,12);cx.fillStyle=COL.coinH;cx.fillRect(c.x-w/4,c.y-4,w/2,2)});

  // Enemies
  ens.forEach(e=>{if(!e.alive)return;const bob=Math.sin(e.fr*3)*2;
    cx.fillStyle=COL.en;cx.fillRect(e.x+2,e.y+2+bob,e.w-4,e.h-4);
    cx.fillStyle=COL.enH;cx.fillRect(e.x+4,e.y+4+bob,e.w-8,3);
    cx.fillStyle='#000';cx.fillRect(e.x+6,e.y+8+bob,6,2);cx.fillRect(e.x+16,e.y+8+bob,6,2);
    cx.fillStyle=COL.enE;cx.fillRect(e.x+7,e.y+11+bob,4,4);cx.fillRect(e.x+17,e.y+11+bob,4,4);
    const ld=pl.x>e.x?1:0;cx.fillStyle='#000';cx.fillRect(e.x+8+ld,e.y+12+bob,2,2);cx.fillRect(e.x+18+ld,e.y+12+bob,2,2);
    cx.fillRect(e.x+9,e.y+19+bob,10,2);
    cx.fillStyle=COL.en;const wk=Math.sin(e.fr*6)*2;
    cx.fillRect(e.x+3,e.y+e.h+bob-2,7,4+wk);cx.fillRect(e.x+e.w-10,e.y+e.h+bob-2,7,4-wk)});

  // Player
  if(!pl.dead||(gs==='dead'&&dT>50)){
    const blink=pl.inv>0&&Math.floor(pl.inv/3)%2;
    if(!blink){
      if(nLoaded){
        cx.save();
        if(pl.face<0){cx.translate(pl.x+pl.w,pl.y);cx.scale(-1,1);cx.drawImage(nImg,0,0,pl.w,pl.h)}
        else cx.drawImage(nImg,pl.x,pl.y,pl.w,pl.h);
        cx.restore();
      } else {
        cx.fillStyle='#e3e5e4';cx.fillRect(pl.x,pl.y,pl.w,pl.h);
        cx.fillStyle='#0d0e0f';cx.fillRect(pl.x+6,pl.y+8,5,5);cx.fillRect(pl.x+17,pl.y+8,5,5);cx.fillRect(pl.x+8,pl.y+20,12,3);
      }
    }
  }

  // Ghost (multiplayer)
  if(mpState==='racing')renderGhost();
  // Boss
  if(gs==='boss'&&boss&&boss.hp>0)renderBoss();

  // Particles
  pts.forEach(p=>{cx.globalAlpha=Math.min(1,p.life/30);cx.fillStyle=p.c;
    if(p.ic)cx.fillRect(p.x-4,p.y-4,8,8);else cx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz)});
  cx.globalAlpha=1;
  cx.restore();

  // HUD
  drawHUD();
  if(gs==='boss'&&boss&&boss.hp>0)drawBossHP();

  // Overlays
  shareBtn.vis=false;
  if(gs==='dead'&&lives>0)drawOv('LIVES: '+lives,dT<=0?'Press any key...':'');
  if(gs==='lc')drawOvLC();
  if(gs==='go')drawOvEnd('GAME OVER','Score: '+score,false);
  if(gs==='win')drawOvEnd('YOU WIN!','Final Score: '+score,true);
  drawAchToast();
}

let dailyMode=false,dailySeed=0,dailyLB=[];

function seededRNG(seed){let s=seed;return()=>{s=(s*16807+0)%2147483647;return(s-1)/2147483646}}
function buildDailyLv(seed){
  const rng=seededRNG(seed);const W=160,H=RW;
  const m=Array.from({length:H},()=>new Array(W).fill(T.A));
  // Ground with gaps
  const gnd=new Array(W).fill(1);
  for(let i=0;i<8;i++){const p=15+Math.floor(rng()*120);const l=2+Math.floor(rng()*2);for(let j=0;j<l;j++)if(p+j<W)gnd[p+j]=0}
  for(let x=0;x<W;x++){if(gnd[x]){m[H-1][x]=T.G;m[H-2][x]=T.G}else{m[H-1][x]=T.FIRE;m[H-2][x]=T.FIRE}}
  // Platforms
  const platCount=12+Math.floor(rng()*6);
  for(let i=0;i<platCount;i++){
    const px=8+Math.floor(rng()*(W-20)),py=5+Math.floor(rng()*6),pw=2+Math.floor(rng()*4);
    const isQ=rng()>.7;
    for(let j=0;j<pw;j++)if(px+j<W)m[py][px+j]=isQ?T.Q:T.B;
  }
  // Flag
  const fx=W-5;
  for(let y=3;y<=H-3;y++)m[y][fx]=T.F;
  m[2][fx]=T.FT;
  tiles=m;lW=W;
  // Enemies
  const enC=10+Math.floor(rng()*8);
  ens=[];for(let i=0;i<enC;i++){
    const ex=10+Math.floor(rng()*(W-20));
    ens.push({x:ex*TZ,y:12*TZ,w:28,h:28,vx:-1.2,vy:0,alive:true,fr:Math.random()*6,grounded:false});
  }
  // Coins
  const coC=15+Math.floor(rng()*10);
  cns=[];for(let i=0;i<coC;i++){
    const cx2=5+Math.floor(rng()*(W-10)),cy=4+Math.floor(rng()*8);
    cns.push({x:cx2*TZ+8,y:cy*TZ+8,col:false,fr:Math.random()*6});
  }
  pl={x:3*TZ,y:10*TZ,w:28,h:30,vx:0,vy:0,grounded:false,face:1,dead:false,inv:0};
  cam={x:0};pts=[];dT=0;cT=0;
  // Store daily level data for flag check
  dailyFx=fx;
}

function mpConnect(){
  if(mpWs){try{mpWs.close()}catch(e){};mpWs=null}
  const proto=location.protocol==='https:'?'wss:':'ws:';
  mpWs=new WebSocket(proto+'//'+location.host);
  mpWs.onopen=()=>{};
  mpWs.onmessage=e=>{
    const msg=JSON.parse(e.data);
    switch(msg.type){
      case'created':mpCode=msg.code;mpSlot=msg.slot;mpState='waiting';break;
      case'joined':mpCode=msg.code;mpSlot=msg.slot;mpState='waiting';break;
      case'opponent_joined':mpState='countdown';break;
      case'countdown':mpCountdown=msg.count;break;
      case'start':
        mpState='racing';gs='play';dailyMode=false;
        iA();loadNormieImg(nId);
        loadTraits(nId).then(()=>{
          score=0;cc=0;lives=3+tMod.bLives;cLv=0;runTime=0;totalDeaths=0;
          initBg();buildLv(0);gs='play';
          if(sndMode===2)startMusic();
        });
        break;
      case'ghost':
        mpGhost={x:msg.x,y:msg.y,alive:msg.alive,face:msg.face,normieId:msg.normieId,vis:true};
        if(!ghostImg.src||ghostImg._nid!==msg.normieId){
          ghostImg=new Image();ghostImg.crossOrigin='anonymous';ghostImg._nid=msg.normieId;
          ghostImg.src='https://api.normies.art/normie/'+msg.normieId+'/image.png';
        }
        break;
      case'opponent_flag':mpResult={won:false,theirTime:msg.time,theirScore:msg.score};
        gs='mpresult';stopMusic();break;
      case'race_end':break;
      case'opponent_left':
        if(mpState==='racing'||mpState==='countdown'){mpResult={won:true,disconnected:true};gs='mpresult';stopMusic();unlock('mp_win')}
        else{mpState='menu';gs='mp'}
        break;
      case'error':mpState='menu';gs='mp';break;
    }
  };
  mpWs.onclose=()=>{if(mpState==='racing'){mpResult={won:true,disconnected:true};gs='mpresult';unlock('mp_win')}};
}

function mpCreateRoom(){
  mpConnect();
  setTimeout(()=>{if(mpWs&&mpWs.readyState===1)mpWs.send(JSON.stringify({type:'create',normieId:nId}))},300);
}

function mpJoinRoom(code){
  mpConnect();
  setTimeout(()=>{if(mpWs&&mpWs.readyState===1)mpWs.send(JSON.stringify({type:'join',normieId:nId,code}))},300);
}

let mpInputCode='';
function drawMPScreen(){
  cx.fillStyle='rgba(0,0,0,0.95)';cx.fillRect(0,0,CW,CH);
  cx.textAlign='center';
  if(mpState==='menu'){
    cx.font='20px "Press Start 2P",monospace';cx.fillStyle=COL.coinH;
    cx.fillText('MULTIPLAYER RACE',CW/2,80);
    cx.font='10px "Press Start 2P",monospace';cx.fillStyle='rgba(227,229,228,0.5)';
    cx.fillText('Race against another player!',CW/2,120);
    // Create room button
    const bw=280,bh=32;
    cx.fillStyle='rgba(227,229,228,0.08)';cx.fillRect(CW/2-bw/2,140,bw,bh);
    cx.strokeStyle='rgba(227,229,228,0.3)';cx.lineWidth=1;cx.strokeRect(CW/2-bw/2,140,bw,bh);
    cx.font='11px "Press Start 2P",monospace';cx.fillStyle=COL.txt;
    cx.fillText('CREATE ROOM',CW/2,162);
    // Join room
    cx.fillStyle='rgba(227,229,228,0.08)';cx.fillRect(CW/2-bw/2,182,bw,bh);
    cx.strokeStyle='rgba(227,229,228,0.3)';cx.strokeRect(CW/2-bw/2,182,bw,bh);
    cx.fillStyle=mpInputCode.length===4?COL.coinH:'rgba(227,229,228,0.4)';
    cx.fillText('JOIN ROOM',CW/2,204);
    // Code input label + boxes
    cx.font='9px "Press Start 2P",monospace';cx.fillStyle='rgba(227,229,228,0.5)';
    cx.fillText('Room Code:',CW/2,236);
    for(let i=0;i<4;i++){
      const bx2=CW/2-66+i*35;
      cx.fillStyle=i<mpInputCode.length?'rgba(212,165,32,0.2)':'rgba(227,229,228,0.05)';
      cx.fillRect(bx2,242,30,26);
      cx.strokeStyle=i<mpInputCode.length?'rgba(212,165,32,0.5)':'rgba(227,229,228,0.15)';
      cx.lineWidth=1;cx.strokeRect(bx2,242,30,26);
      if(i<mpInputCode.length){cx.font='12px "Press Start 2P",monospace';cx.fillStyle=COL.coinH;cx.fillText(mpInputCode[i],bx2+15,260)}
    }
    // Numpad (3x4 grid) — matches click handler: padY=280, bH=28, gap=3
    const padX=CW/2-85,padY=280,bW=50,bH=28,gap=3;
    const numLayout=['1','2','3','4','5','6','7','8','9','DEL','0','GO'];
    for(let i=0;i<12;i++){
      const col=i%3,row=Math.floor(i/3);
      const nx=padX+col*(bW+gap),ny=padY+row*(bH+gap);
      const key=numLayout[i];
      const isAction=key==='DEL'||key==='GO';
      cx.fillStyle=isAction?'rgba(227,229,228,0.08)':'rgba(227,229,228,0.05)';
      if(key==='GO'&&mpInputCode.length===4)cx.fillStyle='rgba(212,165,32,0.15)';
      cx.fillRect(nx,ny,bW,bH);
      cx.strokeStyle=isAction?'rgba(227,229,228,0.25)':'rgba(227,229,228,0.12)';
      if(key==='GO'&&mpInputCode.length===4)cx.strokeStyle='rgba(212,165,32,0.5)';
      cx.lineWidth=1;cx.strokeRect(nx,ny,bW,bH);
      cx.font=isAction?'7px "Press Start 2P",monospace':'10px "Press Start 2P",monospace';
      cx.fillStyle=key==='GO'&&mpInputCode.length===4?COL.coinH:COL.txt;
      cx.fillText(key,nx+bW/2,ny+bH/2+4);
    }
    // BACK button — at y=410
    cx.fillStyle='rgba(227,229,228,0.06)';cx.fillRect(CW/2-60,410,120,30);
    cx.strokeStyle='rgba(227,229,228,0.2)';cx.strokeRect(CW/2-60,410,120,30);
    cx.font='9px "Press Start 2P",monospace';cx.fillStyle='rgba(227,229,228,0.4)';
    cx.fillText('BACK',CW/2,430);
  }else if(mpState==='waiting'){
    cx.font='16px "Press Start 2P",monospace';cx.fillStyle=COL.coinH;
    cx.fillText('ROOM: '+mpCode,CW/2,150);
    cx.font='11px "Press Start 2P",monospace';cx.fillStyle='rgba(227,229,228,0.5)';
    cx.fillText('Waiting for opponent...',CW/2,200);
    cx.font='9px "Press Start 2P",monospace';cx.fillStyle='rgba(227,229,228,0.3)';
    cx.fillText('Share this code with a friend',CW/2,240);
    // CANCEL button
    cx.fillStyle='rgba(227,229,228,0.06)';cx.fillRect(CW/2-60,CH-50,120,35);
    cx.strokeStyle='rgba(227,229,228,0.2)';cx.strokeRect(CW/2-60,CH-50,120,35);
    cx.fillStyle='rgba(227,229,228,0.4)';
    cx.fillText('CANCEL',CW/2,CH-28);
  }else if(mpState==='countdown'){
    cx.font='48px "Press Start 2P",monospace';cx.fillStyle=COL.coinH;
    cx.fillText(mpCountdown>0?String(mpCountdown):'GO!',CW/2,CH/2+20);
  }
  cx.textAlign='left';
}

function drawMPResult(){
  cx.fillStyle='rgba(0,0,0,0.9)';cx.fillRect(0,0,CW,CH);
  cx.textAlign='center';
  cx.font='24px "Press Start 2P",monospace';
  if(mpResult&&mpResult.won){
    cx.fillStyle=COL.coinH;cx.fillText('YOU WIN!',CW/2,CH/2-40);
    if(mpResult.disconnected){cx.font='10px "Press Start 2P",monospace';cx.fillStyle='rgba(227,229,228,0.4)';cx.fillText('Opponent disconnected',CW/2,CH/2)}
  }else{
    cx.fillStyle='#a44';cx.fillText('YOU LOSE!',CW/2,CH/2-40);
    if(mpResult){cx.font='10px "Press Start 2P",monospace';cx.fillStyle='rgba(227,229,228,0.5)';
      cx.fillText('Opponent: '+mpResult.theirScore+' pts  '+fmtTime(mpResult.theirTime),CW/2,CH/2)}
  }
  cx.font='11px "Press Start 2P",monospace';cx.fillStyle='rgba(227,229,228,0.5)';
  cx.fillText('Your Score: '+score+'  Time: '+fmtTime(runTime),CW/2,CH/2+30);
  cx.font='9px "Press Start 2P",monospace';cx.fillStyle='rgba(227,229,228,0.3)';
  cx.fillText('Press Space for menu',CW/2,CH/2+80);cx.textAlign='left';
}

// Send position updates in multiplayer
function mpSendUpdate(){
  if(mpWs&&mpWs.readyState===1&&mpState==='racing'){
    mpWs.send(JSON.stringify({type:'update',x:pl.x,y:pl.y,alive:!pl.dead,face:pl.face}));
  }
}

// Render ghost player
function renderGhost(){
  if(!mpGhost.vis||!mpGhost.alive)return;
  cx.save();cx.globalAlpha=0.4;
  if(ghostImg.complete&&ghostImg.naturalWidth>0){
    if(mpGhost.face<0){cx.translate(mpGhost.x+28,mpGhost.y);cx.scale(-1,1);cx.drawImage(ghostImg,0,0,28,30)}
    else cx.drawImage(ghostImg,mpGhost.x,mpGhost.y,28,30);
  }else{
    cx.fillStyle='#88aaff';cx.fillRect(mpGhost.x,mpGhost.y,28,30);
  }
  cx.restore();
}
